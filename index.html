
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أستاذ اليمن AI</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; direction: rtl; }
        .box { max-width: 450px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; background: #00ea7f; color: black; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .board { background: #12261a; color: #f5f5f5; padding: 15px; border-radius: 8px; margin-top: 15px; min-height: 150px; display: none; border: 4px solid #8B4513; }
        .line { border-bottom: 1px dashed rgba(255,255,255,0.1); padding: 5px 0; }
    </style>
</head>
<body>
<div class="box">
    <h2>أستاذ اليمن AI 🎓</h2>
    <textarea id="msg" placeholder="اكتب سؤالك التعليمي هنا..."></textarea>
    <input type="file" id="img" accept="image/*" style="margin-bottom: 15px;"><br>
    <button onclick="send()">إرسال السؤال للأستاذ 🚀</button>
    <div id="brd" class="board"></div>
</div>
<script>
    async function send() {
        const txt = document.getElementById('msg').value;
        const file = document.getElementById('img').files;
        if(!txt && !file) return alert("اكتب سؤالاً أو ارفع صورة!");
        
        const fd = new FormData();
        if(txt) fd.append('text_question', txt);
        if(file) fd.append('image_file', file);

        document.getElementById('brd').style.display = 'none';
        try {
            const res = await fetch('http://localhost:8000/api/ask', { method: 'POST', body: fd });
            const data = await res.json();
            const brd = document.getElementById('brd');
            brd.innerHTML = `<h4>📌 المادة: ${data.classification.subject}</h4>`;
            data.steps.forEach((s, i) => {
                brd.innerHTML += `<div class="line"><b>خطوة ${i+1}:</b> ${s}</div>`;
            });
            brd.style.display = 'block';
        } catch(e) { alert("تأكد من تشغيل الـ Backend أولاً!"); }
    }
</script>
</body>
</html>
